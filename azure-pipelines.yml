trigger:
- main

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: Construindo imagem do site
  jobs:
  - job: Build
    displayName: Build
    pool:
      name: Default
    steps:
    - task: DockerCompose@1
      inputs:
        containerregistrytype: 'Container Registry'
        dockerRegistryEndpoint: 'DockerHub-IdeaCode'
        dockerComposeFile: 'docker/ideacode-compose.yaml'
        action: 'Build services'
        additionalImageTags: '$(Build.BuildId)'
        includeSourceTags: true
        includeLatestTag: true
    - task: DockerCompose@1
      inputs:
        containerregistrytype: 'Container Registry'
        dockerRegistryEndpoint: 'DockerHub-IdeaCode'
        dockerComposeFile: 'docker/ideacode-compose.yaml'
        action: 'Push service images'
        additionalImageTags: '$(Build.BuildId)'
        includeSourceTags: true
        includeLatestTag: true
