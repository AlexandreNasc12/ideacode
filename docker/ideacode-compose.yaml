services:
  api-ideacode:
    image: api-ideacode
    container_name: api-ideacode
    build:
      context: ../src
      dockerfile: ./services/ideacode.api/Dockerfile
    restart: always
    ports:
      - "8081:8081"
    environment:
       ASPNETCORE_ENVIRONMENT: Production
       ASPNETCORE_URLS: http://+:8081;http://+8081
       ConnectionStrings__DefaultConnection: Host=database-ideacode;Port=5432;Database=SiteIdeaCodeDB;Username=ideacode;Password=Xbaybxdb$;Timeout=30
        
  site-ideacode:
    image: site-ideacode
    container_name: site-ideacode
    build:
      context: ../src
      dockerfile: ./website/Dockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
       ASPNETCORE_ENVIRONMENT: Production
       ASPNETCORE_URLS: http://+:8080;http://+8080
       HttpUrls__IdeaWebApi: http://api-ideacode
    depends_on:
      - api-ideacode
  
  database-ideacode:
    image: postgres:16-alpine
    container_name: ideacode-database-site
    restart: always
    expose:
      - 5432
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "SiteIdeaCodeDB"
      POSTGRES_USER: "ideacode"
      POSTGRES_PASSWORD: "Xbaybxdb$"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: