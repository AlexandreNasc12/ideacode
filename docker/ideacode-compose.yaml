services:
  api-ideacode:
    image: api-ideacode
    container_name: api-ideacode
    build:
      context: ../src
      dockerfile: ./services/ideacode.api/Dockerfile
    restart: always
    ports:
      - "8081:8081"
    environment:
       ASPNETCORE_ENVIRONMENT: Production
       ASPNETCORE_URLS: http://+:8081;http://+8081
       CUSTOMCONNSTR_DefaultConnection: Server=database-ideacode;Database=SiteIdeaCodeDB;MultipleActiveResultSets=true;User Id=sa;Password=Xbaybxdb$;Connection Timeout=3500;Trusted_Connection=True;TrustServerCertificate=True;Encrypt=Optional;Integrated Security=False
        
  site-ideacode:
    image: site-ideacode
    container_name: site-ideacode
    build:
      context: ../src
      dockerfile: ./website/Dockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
       ASPNETCORE_ENVIRONMENT: Production
       ASPNETCORE_URLS: http://+:8080;http://+8080
       HttpUrls__IdeaWebApi: http://api-ideacode
    depends_on:
      - api-ideacode
  
  database-ideacode:
    image: mcr.microsoft.com/mssql/server:2017-latest
    container_name: ideacode-database-site
    expose:
      - 1433
    environment:
      SA_PASSWORD: "Xbaybxdb$"
      ACCEPT_EULA: "Y"
    volumes:
      - ./sqlvolume:/var/opt/mssql